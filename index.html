<title>Castle of Words</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: one arcade-cabinet screen centred on a dark page, touch pad beneath on phones and tablets.
   A deliberate single-look dark design (night castle), so every colour is set explicitly. */
:root{
  --bg:#0d0b1a; --panel:#1a1630; --edge:#3a2f6b; --ink:#f4f1e8; --dim:#a39cc4; --gold:#f5c542; --blood:#d24a4a;
  --font-d:'Press Start 2P', ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 30%, #1d1640 0%, var(--bg) 70%) var(--bg);color:var(--ink);
  padding-inline:16px;padding-block:12px;font-family:var(--font-d);overflow-x:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
#app{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#cab{position:relative;padding:6px;background:var(--panel);border:2px solid var(--edge);border-radius:6px;
  box-shadow:0 0 0 2px #000, 0 12px 40px rgba(0,0,0,.6), 0 0 60px rgba(120,80,255,.18)}
#screen{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;outline:none;touch-action:none;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#cab .scan{position:absolute;inset:6px;pointer-events:none;
  background:repeating-linear-gradient(to bottom, rgba(0,0,0,.14) 0 1px, transparent 1px 3px);mix-blend-mode:multiply}
#hint{font-size:9px;line-height:1.7;color:var(--dim);text-align:center;max-width:640px}
#pad{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:420px;gap:16px;user-select:none;-webkit-user-select:none;touch-action:none}
#dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px}
#dpad button{grid-area:auto}
.pb{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--font-d);font-size:10px;color:var(--ink);background:#2a2250;border:2px solid var(--edge);border-radius:4px;
  box-shadow:0 3px 0 #000;touch-action:none;cursor:pointer}
.pb:active{transform:translateY(2px);box-shadow:0 1px 0 #000;background:#3a2f6b}
.pb:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#acts{display:flex;gap:12px;align-items:center}
#acts .pb{width:64px;height:64px;border-radius:50%}
#acts .pb.small{width:48px;height:48px;font-size:8px}
#app.land{flex-direction:row;gap:20px}
#app.land #pad{display:contents}
#app.land #dpad{order:0}#app.land #cab{order:1}#app.land #acts{order:2;flex-direction:column}
@media (prefers-reduced-motion:reduce){#cab .scan{display:none}}
</style>

<main id="app">
  <h1 class="sr">Macbeth: Castle of Words, a vocabulary maze game</h1>
  <div id="cab"><canvas id="screen" tabindex="0" aria-label="Castle of Words game screen"></canvas><div class="scan"></div></div>
  <div id="pad" hidden>
    <div id="dpad">
      <span></span><button class="pb" data-d="0" aria-label="Up">UP</button><span></span>
      <button class="pb" data-d="2" aria-label="Left">LT</button><span></span><button class="pb" data-d="3" aria-label="Right">RT</button>
      <span></span><button class="pb" data-d="1" aria-label="Down">DN</button><span></span>
    </div>
    <div id="acts"><button class="pb small" id="bPause" aria-label="Pause">P</button><button class="pb" id="bAct" aria-label="Confirm">A</button></div>
  </div>
  <p id="hint">ARROWS or WASD to move &middot; SPACE to confirm &middot; P to pause &middot; M for music</p>
</main>

<script>
(()=>{
'use strict';

/* =====================================================================
   1. THE WORDS  (edit this list to change the game's content)
   act: 1 or 2.  def: floor 1 clue.  scene: floor 2 clue ("___" is the gap).
   Keep clues under ~110 characters and use straight quotes only.
   ===================================================================== */
const WORDS=[
 {w:'paradox',act:1,def:"a statement that seems to contradict itself but still holds a truth.",
  scene:'The witches chant "Fair is foul, and foul is fair." This is a ___.'},
 {w:'aside',act:1,def:"words a character says that the audience hears but the other characters do not.",
  scene:'Duncan names Malcolm his heir. Macbeth mutters "Stars, hide your fires" for the audience only. An ___.'},
 {w:'infer',act:1,def:"to work out something the writer hints at but does not say directly.",
  scene:'Lady Macbeth says "Look like th\'innocent flower, but be the serpent under\'t." We ___ she is plotting.'},
 {w:'dramatic irony',act:1,def:"when the audience knows something that a character does not.",
  scene:'Duncan calls the Macbeths\' castle a "pleasant seat". We know they plan to murder him there. This is ___.'},
 {w:'soliloquy',act:2,def:"a speech in which a character speaks their thoughts, alone on stage.",
  scene:'Alone on stage, Macbeth asks "Is this a dagger which I see before me?" This speech is a ___.'},
 {w:'foreshadowing',act:2,def:"when an author gives early hints or clues about what will happen later in a story.",
  scene:'Banquo warns that dark powers tell truths "to win us to our harm". It hints at trouble ahead: ___.'},
 {w:'situational irony',act:2,def:"when what happens (or what is said) is the opposite of what you'd expect.",
  scene:'Duncan gives a traitor\'s title to Macbeth, hoping for loyalty. Macbeth betrays him too: ___.'}
];

/* =====================================================================
   2. CONSTANTS, HELPERS
   ===================================================================== */
const TS=16, COLS=19, ROWS=15, W=COLS*TS, HUD=16, MAPH=ROWS*TS, BOX=64, H=HUD+MAPH+BOX; // 304 x 320
const cv=document.getElementById('screen'); cv.width=W; cv.height=H;
const ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=false;
const FONT='"Press Start 2P", ui-monospace, Menlo, Consolas, monospace';
const GOLD='#f5c542', INK='#f4f1e8', DIM='#a39cc4', RED='#d24a4a', K='#1b1226';
const DIRS=[[0,-1],[0,1],[-1,0],[1,0]]; // up down left right

const mk=(w,h,f)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;f(g);return c;};
const R=(g,col,x,y,w,h)=>{g.fillStyle=col;g.fillRect(x,y,w,h);};
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function disc(g,cx,cy,r){for(let dy=-r;dy<=r;dy++){const w=Math.floor(Math.sqrt(r*r-dy*dy));g.fillRect(Math.round(cx-w),Math.round(cy+dy),w*2,1);}}
function wrap(s,n){const out=[];let line='';for(const w of s.split(' ')){if((line+' '+w).trim().length>n){out.push(line);line=w;}else line=(line+' '+w).trim();}if(line)out.push(line);return out;}
function txt(s,x,y,col=INK,size=8,align='left',shadow=true){
  ctx.font=size+'px '+FONT;ctx.textBaseline='top';ctx.textAlign=align;
  if(shadow){ctx.fillStyle='#000';ctx.fillText(s,x+1,y+1);}
  ctx.fillStyle=col;ctx.fillText(s,x,y);
}
function pbox(x,y,w,h,fill='#14122b'){
  R(ctx,'#000',x+2,y,w-4,h);R(ctx,'#000',x,y+2,w,h-4);
  R(ctx,INK,x+2,y+1,w-4,h-2);R(ctx,INK,x+1,y+2,w-2,h-4);
  R(ctx,'#5a4fa0',x+3,y+2,w-6,h-4);R(ctx,'#5a4fa0',x+2,y+3,w-4,h-6);
  R(ctx,fill,x+4,y+3,w-8,h-6);R(ctx,fill,x+3,y+4,w-6,h-8);
}
function arrowR(x,y,col=GOLD){R(ctx,col,x,y,1,7);R(ctx,col,x+1,y+1,1,5);R(ctx,col,x+2,y+2,1,3);R(ctx,col,x+3,y+3,1,1);}
function arrowD(x,y,col=GOLD){R(ctx,col,x,y,7,1);R(ctx,col,x+1,y+1,5,1);R(ctx,col,x+2,y+2,3,1);R(ctx,col,x+3,y+3,1,1);}
function star(x,y,on){const c=on?GOLD:'#3a3358';R(ctx,c,x+3,y,1,1);R(ctx,c,x+2,y+1,3,1);R(ctx,c,x,y+2,7,1);R(ctx,c,x+1,y+3,5,1);R(ctx,c,x+2,y+4,3,1);R(ctx,c,x+1,y+5,2,1);R(ctx,c,x+4,y+5,2,1);}

/* =====================================================================
   3. SPRITES  (all drawn in code; PNG strips in assets/ override them)
   ===================================================================== */
const SP={};
function playerSprite(dir,fr){
  return mk(16,16,g=>{
    const SK='#f2c294',SKs='#c98f66',HR='#6b3f24',HRd='#4a2916',TN='#c93a3a',TNd='#8c2430',BT='#3b2a22';
    R(g,'rgba(0,0,0,.35)',3,13,10,2);
    const s=fr?1:0;
    if(dir<2){ // front/back: boots alternate
      R(g,K,4,11+s,4,4);R(g,BT,5,12+s,2,2);R(g,K,8,12-s+1,4,3);R(g,BT,9,12-s+1,2,1);
    }else{ // side: boots swap horizontally
      R(g,K,5+s*2,12,4,3);R(g,BT,6+s*2,12,2,2);R(g,K,8-s*2,12,4,3);R(g,BT,9-s*2,12,2,1);
    }
    // tunic + outline
    R(g,K,3,6,10,6);R(g,TN,4,7,8,4);R(g,TNd,4,10,8,1);R(g,GOLD,4,9,8,1);R(g,'#fff1a8',7,9,2,1);
    if(dir<2){R(g,SK,3,8,1,2);R(g,SK,12,8,1,2);R(g,K,2,8,1,3);R(g,K,13,8,1,3);}
    else{R(g,TNd,6,7,4,3);R(g,SK,7,8,2,2);}
    // head
    R(g,K,4,0,8,7);R(g,K,3,1,10,5);
    if(dir===0){R(g,HR,4,1,8,2);R(g,HR,3,2,1,3);R(g,HR,12,2,1,3);R(g,SK,4,3,8,3);R(g,SKs,4,5,8,1);R(g,K,6,4,1,2);R(g,K,9,4,1,2);R(g,'#e87a7a',7,5,2,1);}
    else if(dir===1){R(g,HR,4,1,8,5);R(g,HRd,4,4,8,2);R(g,HRd,7,2,2,1);}
    else{R(g,HR,4,1,8,2);R(g,HR,8,2,4,4);R(g,SK,4,3,5,3);R(g,SKs,4,5,5,1);R(g,K,5,4,1,2);R(g,SK,3,4,1,2);}
    // tiny feather
    R(g,'#e8e8e8',10,0,1,2);R(g,'#bdbdbd',11,1,1,1);
  });
}
function mirror(c){return mk(c.width,c.height,g=>{g.translate(c.width,0);g.scale(-1,1);g.drawImage(c,0,0);});}
SP.player=[[0,1].map(f=>playerSprite(0,f)),[0,1].map(f=>playerSprite(1,f)),[0,1].map(f=>playerSprite(2,f))];
SP.player.push(SP.player[2].map(mirror));

function ghostSprite(c,cd,cl,fr,kind,ox=0,oy=0){ // kind: 'norm' | 'scared' | 'flash' | 'eyes'
  return mk(16,16,g=>{
    if(kind==='eyes'){R(g,'#fff',4,6,3,3);R(g,'#fff',9,6,3,3);R(g,'#2a2aa0',5+ox,7+oy,1,2);R(g,'#2a2aa0',10+ox,7+oy,1,2);return;}
    if(kind==='scared'){c='#3b46c8';cd='#252c8a';} if(kind==='flash'){c='#e8e8ff';cd='#9aa0e0';}
    const rows=[[7,2],[6,4],[5,6],[4,8],[3,10],[3,10],[3,10],[3,10],[3,10],[3,10],[3,10]];
    rows.forEach(([x,w],i)=>{R(g,K,x-1,i+1,w+2,1);R(g,c,x,i+1,w,1);});
    R(g,K,7,0,2,1);
    R(g,cd,3,9,1,3);R(g,cd,12,9,1,3);R(g,cd,4,6,1,3);
    // tatters
    R(g,K,2,12,12,1);R(g,c,3,12,10,1);
    const tat=fr?[3,4,7,8,11,12]:[5,6,9,10,3,12];
    for(const x of tat){R(g,c,x,13,1,2);}
    R(g,K,3,14,1,1);R(g,K,12,14,1,1);
    if(kind==='norm'){
      R(g,'#0a0612',5,4,6,4);
      R(g,'#ffe066',6+ox,5+oy,2,2);R(g,'#ffe066',9+ox,5+oy,2,2);
      R(g,cl,5,3,6,1);
    }else{
      R(g,kind==='flash'?'#e83a3a':'#fff',5,5,2,2);R(g,kind==='flash'?'#e83a3a':'#fff',9,5,2,2);
      for(let i=0;i<4;i++)R(g,kind==='flash'?'#e83a3a':'#fff',4+i*2,9+(i%2),1,1);
    }
  });
}
const GCOL=[['#8a4fd0','#5a2f96','#c9a6ff'],['#3fae6a','#237a46','#9af0b8'],['#d04a4a','#962a2a','#ffb0a0']];
SP.ghost=GCOL.map(([c,cd,cl])=>{
  const o={};
  for(const f of [0,1]){for(let d=0;d<4;d++){const ox=[0,0,-1,1][d],oy=[-1,1,0,0][d];o['n'+f+d]=ghostSprite(c,cd,cl,f,'norm',ox,oy);}}
  return o;
});
SP.scared=[0,1].map(f=>ghostSprite(0,0,0,f,'scared'));
SP.flash=[0,1].map(f=>ghostSprite(0,0,0,f,'flash'));
SP.eyes=[0,1,2,3].map(d=>ghostSprite(0,0,0,0,'eyes',[0,0,-1,1][d],[-1,1,0,0][d]));

SP.scroll=mk(16,16,g=>{
  R(g,'rgba(0,0,0,.3)',3,13,10,2);
  R(g,K,2,3,12,10);R(g,'#f1e0b0',4,4,8,8);R(g,'#d7c08a',4,10,8,2);
  R(g,K,1,3,3,10);R(g,'#c9ab6c',2,4,1,8);R(g,K,12,3,3,10);R(g,'#c9ab6c',13,4,1,8);
  R(g,'#8a6a3a',5,5,6,1);R(g,'#8a6a3a',5,7,4,1);
  R(g,K,7,8,4,4);R(g,RED,8,9,2,2);R(g,'#ff8a8a',8,9,1,1);
});
SP.dagger=mk(16,16,g=>{
  R(g,K,6,0,4,10);R(g,'#dfe6f0',7,1,2,8);R(g,'#fff',7,1,1,7);R(g,'#8a94a8',8,3,1,6);
  R(g,K,3,9,10,3);R(g,GOLD,4,10,8,1);
  R(g,K,6,11,4,4);R(g,'#6b3f24',7,12,2,2);R(g,GOLD,6,14,4,1);
  R(g,RED,8,3,1,3);R(g,RED,8,7,1,1);
});
SP.gem=mk(16,16,g=>{R(g,K,6,6,4,4);R(g,GOLD,7,7,2,2);R(g,'#fff6b0',7,7,1,1);});
SP.stairs=[['#6ec8ff','#1d5a8a'],['#9dff9a','#2a7a3a']].map(([lc,dc])=>mk(16,16,g=>{
  // a wooden ladder rising out of a glowing hatch (the "ladder")
  R(g,K,1,1,14,14);R(g,dc,2,2,12,12);R(g,'#0e0a1c',3,3,10,10);
  R(g,lc,2,2,12,1);R(g,lc,2,13,12,1);R(g,lc,2,2,1,12);R(g,lc,13,2,1,12);
  R(g,'#8a5a30',5,1,2,14);R(g,'#8a5a30',9,1,2,14);R(g,'#b8814a',5,1,1,14);R(g,'#b8814a',9,1,1,14);
  for(let y=3;y<14;y+=3){R(g,'#6b4a2a',7,y,2,1);R(g,'#d9a86a',7,y,2,1);}
  R(g,'#fff',7,1,2,1);
}));
SP.trap=mk(16,16,g=>{
  // rotten floor planks over a black pit (the "snake")
  R(g,K,1,1,14,14);R(g,'#6a4a2c',2,2,12,12);
  for(let i=0;i<4;i++){R(g,'#7d5a34',2,2+i*3,12,2);R(g,'#3e2a14',2,4+i*3,12,1);}
  R(g,'#05030a',4,5,8,6);R(g,'#1a0a2a',5,6,6,3);R(g,'#2a1040',6,7,4,1);
  R(g,'#7d5a34',4,4,2,1);R(g,'#7d5a34',10,4,2,1);R(g,'#7d5a34',4,11,2,1);R(g,'#7d5a34',10,11,2,1);
  R(g,'#a07a48',3,3,1,1);R(g,'#a07a48',12,10,1,1);
  R(g,RED,2,2,2,2);R(g,'#ff9a9a',2,2,1,1);R(g,RED,12,2,2,2);R(g,RED,2,12,2,2);R(g,RED,12,12,2,2);
});
SP.torch=[0,1].map(f=>mk(16,16,g=>{
  R(g,K,7,7,2,6);R(g,'#6b4a2a',7,8,2,4);R(g,K,5,6,6,2);R(g,'#8a8a9a',6,6,4,1);
  R(g,'#d04a1a',6,3-f,4,3+f);R(g,'#ff9a2e',7,2-f,2,4+f);R(g,'#ffe066',7,4,2,2);
}));
SP.cauldron=[0,1].map(f=>mk(16,16,g=>{
  R(g,'rgba(0,0,0,.4)',2,13,12,2);
  R(g,K,2,6,12,8);R(g,'#2a2a38',3,7,10,6);R(g,'#4a4a5a',3,7,2,5);
  R(g,K,1,5,14,3);R(g,'#5a5a6a',2,6,12,1);
  R(g,'#4fe07a',3,5,10,1);R(g,'#8fffb0',4+f*3,4,2,1);R(g,'#8fffb0',9-f*2,3+f,1,1);
  R(g,K,3,14,2,2);R(g,K,11,14,2,2);
}));
SP.candle=[true,false].map(on=>mk(8,12,g=>{
  R(g,K,1,4,6,8);R(g,on?'#f1e8c8':'#6a6678',2,5,4,6);R(g,on?'#cfc49a':'#4a4658',2,9,4,2);
  if(on){R(g,'#ff9a2e',3,1,2,3);R(g,'#ffe066',3,2,2,1);R(g,K,3,4,2,1);}else{R(g,'#444',3,3,2,2);}
}));

// Optional overrides: put 16px-tall PNG strips in an assets/ folder next to this file.
function strip(name,n,apply){
  const im=new Image();
  im.onload=()=>{try{const fr=[];for(let i=0;i<n;i++)fr.push(mk(16,16,g=>g.drawImage(im,i*16,0,16,16,0,0,16,16)));apply(fr);}catch(e){}};
  im.onerror=()=>{};
  im.src='assets/'+name+'.png';
}
function loadOverrides(){
  strip('player',8,f=>{SP.player=[[f[0],f[1]],[f[2],f[3]],[f[4],f[5]],[f[6],f[7]]];});
  [1,2,3].forEach(i=>strip('ghost'+i,2,f=>{for(let d=0;d<4;d++){SP.ghost[i-1]['n0'+d]=f[0];SP.ghost[i-1]['n1'+d]=f[1];}}));
  strip('scared',2,f=>{SP.scared=f;SP.flash=f;});
  strip('scroll',1,f=>{SP.scroll=f[0];}); strip('dagger',1,f=>{SP.dagger=f[0];});
  strip('gem',1,f=>{SP.gem=f[0];});
  strip('stairs1',1,f=>{SP.stairs[0]=f[0];}); strip('stairs2',1,f=>{SP.stairs[1]=f[0];});
  strip('trapdoor',1,f=>{SP.trap=f[0];}); strip('torch',2,f=>{SP.torch=f;});
  strip('cauldron',2,f=>{SP.cauldron=f;});
}

/* =====================================================================
   4. AUDIO  (tiny synth: no files needed)
   ===================================================================== */
function unlockAudio(){
  const a=ac();if(!a)return;
  try{const b=a.createBuffer(1,1,22050),src=a.createBufferSource();src.buffer=b;src.connect(a.destination);src.start(0);}catch(e){}
  if(a.state==='running'){['touchend','pointerup','click','keydown'].forEach(ev=>removeEventListener(ev,unlockAudio,true));}
}
let AC=null,musicOn=false,sfxOn=true,mTimer=null,mStep=0;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type='square',v=.05,at=0,f2=null,force=false){
  if(!sfxOn&&!force)return;const a=ac();if(!a)return;
  const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+at;o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03);
}
function noise(d,v=.08){if(!sfxOn)return;const a=ac();if(!a)return;const n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);

/* =====================================================================
   5. MAZE GENERATION  (mirror-symmetric castle corridors, seeded)
   ===================================================================== */
function genMaze(seed){
  for(let attempt=0;attempt<50;attempt++){
    const rnd=rng(seed+attempt*7919);
    const g=Array.from({length:ROWS},()=>Array(COLS).fill(1));
    const seen=new Set(['7,7','7,9']); // keep the ghost-house cells out of the maze
    const st=[[1,1]];g[1][1]=0;seen.add('1,1');
    while(st.length){
      const [r,c]=st[st.length-1];
      const nb=[[r-2,c],[r+2,c],[r,c-2],[r,c+2]].filter(([a,b])=>a>=1&&a<=ROWS-2&&b>=1&&b<=9&&!seen.has(a+','+b));
      if(!nb.length){st.pop();continue;}
      const [a,b]=nb[Math.floor(rnd()*nb.length)];
      g[(r+a)/2][(c+b)/2]=0;g[a][b]=0;seen.add(a+','+b);st.push([a,b]);
    }
    const mir=()=>{for(let r=0;r<ROWS;r++)for(let c=0;c<=8;c++)g[r][COLS-1-c]=g[r][c];};
    mir();
    g[7][8]=g[7][9]=g[7][10]=3;g[6][9]=2;
    const inHouse=(r,c)=>r>=6&&r<=8&&c>=6&&c<=12;
    const open=(r,c)=>r>=0&&r<ROWS&&c>=0&&c<COLS&&g[r][c]===0;
    // braid dead ends so the maze loops (Pac-Man style) instead of trapping you
    const wallOk=(r,c,dr,dc)=>{
      const wr=r+dr,wc=c+dc,br=r+2*dr,bc=c+2*dc;
      if(wr<1||wr>ROWS-2||wc<1||wc>COLS-2||br<1||br>ROWS-2||bc<1||bc>COLS-2)return false;
      if(g[wr][wc]!==1||g[br][bc]!==0||inHouse(wr,wc))return false;
      if(dc===1&&c===9)return false; if(wc>9)return false;
      return true;
    };
    for(let r=1;r<ROWS-1;r++)for(let c=1;c<=9;c++){
      if(g[r][c]!==0)continue;
      const n=DIRS.filter(([dc,dr])=>open(r+dr,c+dc)).length;
      if(n===1&&rnd()<.9){
        const cand=DIRS.filter(([dc,dr])=>wallOk(r,c,dr,dc));
        if(cand.length){const [dc,dr]=cand[Math.floor(rnd()*cand.length)];g[r+dr][c+dc]=0;}
      }
    }
    for(let k=0;k<7;k++){
      const r=1+2*Math.floor(rnd()*7),c=1+2*Math.floor(rnd()*5);
      const [dc,dr]=DIRS[Math.floor(rnd()*4)];
      if(g[r][c]===0&&wallOk(r,c,dr,dc))g[r+dr][c+dc]=0;
    }
    mir();
    g[7][8]=g[7][9]=g[7][10]=3;g[6][9]=2;
    // validate: every open tile reachable from the start
    const start={x:9,y:13};
    const dist=bfs(g,start.x,start.y,false);
    let ok=g[start.y][start.x]===0&&g[5][9]===0;
    for(let r=0;r<ROWS&&ok;r++)for(let c=0;c<COLS;c++)if(g[r][c]===0&&dist[r][c]<0){ok=false;break;}
    if(ok)return {g,start,dist};
  }
  throw new Error('maze failed');
}
function bfs(g,sx,sy,allowHouse){
  const d=Array.from({length:ROWS},()=>Array(COLS).fill(-1));
  const q=[[sx,sy]];d[sy][sx]=0;
  while(q.length){const [x,y]=q.shift();
    for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=COLS||ny>=ROWS||d[ny][nx]>=0)continue;
      const v=g[ny][nx];if(v===1||((v===2||v===3)&&!allowHouse))continue;
      d[ny][nx]=d[y][x]+1;q.push([nx,ny]);}}
  return d;
}

function startRoom(i){
  roomIdx=i;const rm=plan[i];candles=maxCandles; // each room starts with a full set of candles
  const seed=1000+i*131+rm.word.w.length*17;
  const m=genMaze(seed);
  const rnd=rng(seed+99);
  L={g:m.g,start:m.start,dist0:m.dist,seed,gem:Array.from({length:ROWS},()=>Array(COLS).fill(false)),
     scrolls:[],daggers:[],stairs:[],traps:[],torches:[],distHouse:bfs(m.g,9,7,true),clock:0};
  const used=new Set();const key=(x,y)=>x+','+y;
  const openT=[];for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(m.g[y][x]===0)openT.push({x,y});
  used.add(key(9,13));
  [[1,1],[17,1],[1,13],[17,13]].forEach(([x,y])=>{L.daggers.push({x,y,alive:true});used.add(key(x,y));});
  // scrolls
  const others=shuffle(WORDS.filter(w=>w!==rm.word),rnd).slice(0,3);
  const labels=shuffle([rm.word,...others],rnd);
  const cand=shuffle(openT.filter(t=>m.dist[t.y][t.x]>=9&&!used.has(key(t.x,t.y))),rnd);
  const picked=[];
  for(const relax of [0,1,2]){
    for(const t of cand){
      if(picked.length>=4)break;
      if(picked.includes(t)||used.has(key(t.x,t.y)))continue;
      if(picked.every(p=>relax>=2||(Math.abs(p.x-t.x)>=(relax?5:7)||Math.abs(p.y-t.y)>=3)&&Math.abs(p.x-t.x)+Math.abs(p.y-t.y)>=(relax?6:8))){picked.push(t);}
    }

  for(let k=0;k<nPairs;k++){
    const pool=shuffle(openT.filter(t=>!used.has(key(t.x,t.y))&&t.y>=2),rnd);
    let found=false;
    for(const a of pool.slice(0,40)){
      const d=bfs(m.g,a.x,a.y,false);
      const ends=L.stairs.flatMap(q=>[q.a,q.b]);
      const bs=pool.filter(b=>b!==a&&!used.has(key(b.x,b.y))&&d[b.y][b.x]>=14&&Math.hypot(a.x-b.x,a.y-b.y)>=6&&connectedWithout([...ends,a,b]));
      if(bs.length){const b=bs[Math.floor(rnd()*bs.length)];L.stairs.push({a:{x:a.x,y:a.y},b:{x:b.x,y:b.y},c:k});used.add(key(a.x,a.y));used.add(key(b.x,b.y));found=true;break;}
    }
  }

  const nTrap=i<4?2:3;
  const corr=shuffle(openT.filter(t=>!used.has(key(t.x,t.y))&&m.dist[t.y][t.x]>=5&&DIRS.filter(([dx,dy])=>m.g[t.y+dy]&&m.g[t.y+dy][t.x+dx]===0).length===2),rnd);
  for(const t of corr){
    if(L.traps.length>=nTrap)break;
    if(L.traps.every(q=>Math.abs(q.x-t.x)+Math.abs(q.y-t.y)>=5)&&!used.has(key(t.x,t.y))&&connectedWithout([...L.traps,t,...L.stairs.flatMap(q=>[q.a,q.b])])){L.traps.push({x:t.x,y:t.y});used.add(key(t.x,t.y));}

/* ---- static tile layer ------------------------------------------------ */
const isWall=(x,y)=>x<0||y<0||x>=COLS||y>=ROWS||L.g[y][x]===1;
function buildStatic(){
  return mk(W,MAPH,g=>{
    const r=rng(L.seed*3+5);

      const v=L.g[y][x],px=x*TS,py=y*TS;
      if(v===1)wallTile(g,x,y,px,py,r);else floorTile(g,x,y,px,py,r,v);

function floorTile(g,x,y,px,py,r,v){

  if(r()<.12){const cx=px+3+Math.floor(r()*8),cy=py+3+Math.floor(r()*8);R(g,'#241f30',cx,cy,1,1);R(g,'#241f30',cx+1,cy+1,1,1);R(g,'#241f30',cx+2,cy+1,1,1);R(g,'#241f30',cx+3,cy+2,1,1);}
  if(r()<.08){const cx=px+Math.floor(r()*12),cy=py+Math.floor(r()*12);R(g,'#3e5a3a',cx,cy,2,1);R(g,'#4b7045',cx,cy+1,1,1);}
  if(isWall(x,y-1)){R(g,'rgba(0,0,0,.38)',px,py,16,3);R(g,'rgba(0,0,0,.2)',px,py+3,16,2);}
  if(isWall(x-1,y))R(g,'rgba(0,0,0,.2)',px,py,2,16);
  if(v===2){ // iron gate
    R(g,'#14122b',px,py,16,16);
    for(let i=0;i<4;i++){R(g,'#7a7a90',px+2+i*4,py,2,16);R(g,'#b0b0c8',px+2+i*4,py,1,16);}
    R(g,'#7a7a90',px,py+4,16,2);R(g,'#7a7a90',px,py+11,16,2);R(g,GOLD,px+7,py+6,2,3);

function wallTile(g,x,y,px,py,r){
  const face=!isWall(x,y+1);
  if(face){
    R(g,'#1e1b33',px,py,16,16);
    const shades=['#5b5a80','#54537a','#63628a','#4d4c72'];
    for(let k=0;k<4;k++){

    if(!isWall(x-1,y))R(g,'rgba(255,255,255,.12)',px,py,1,16);
    if(!isWall(x+1,y))R(g,'rgba(0,0,0,.25)',px+15,py,1,16);
  }else{
    R(g,'#2b2845',px,py,16,16);
    for(let i=0;i<10;i++)R(g,r()<.5?'#322f4e':'#242139',px+Math.floor(r()*15),py+Math.floor(r()*15),2,1);
    if(!isWall(x,y-1))R(g,'#4a4670',px,py,16,2);
    if(!isWall(x-1,y))R(g,'#3d3a63',px,py,2,16);

  }

const gSpeed=()=>(cfg.mode==='calm'?3.3:4.1)+Math.min(roomIdx,10)*.04;
const PSPEED=5.2;

const canGo=(e,d)=>{const [dx,dy]=DIRS[d];const x=e.tx+dx,y=e.ty+dy;return x>=0&&y>=0&&x<COLS&&y<ROWS&&L.g[y][x]===0;};

function reverse(e){if(!e.moving)return;e.tx+=e.dx;e.ty+=e.dy;e.dx=-e.dx;e.dy=-e.dy;e.t=1-e.t;}
function advance(e,dist,arrive){
  let guard=0;
  while(dist>0&&e.moving&&guard++<8){
    const rem=1-e.t;
    if(dist<rem){e.t+=dist;return;}
    dist-=rem;e.tx+=e.dx;e.ty+=e.dy;e.t=0;arrive(e);
  }
}
const nearest=e=>({x:e.tx+(e.t>=.5?e.dx:0),y:e.ty+(e.t>=.5?e.dy:0)});

function pArrive(e){
  const k=e.tx+','+e.ty;
  if(e.warp&&e.warp!==k)e.warp=null;
  // stairs
  for(const s of L.stairs){
    let to=null;
    if(s.a.x===e.tx&&s.a.y===e.ty)to=s.b;else if(s.b.x===e.tx&&s.b.y===e.ty)to=s.a;

  if(e.want>=0&&canGo(e,e.want)){setDir(e,e.want);}

function gPass(x,y,state){

function gTarget(g){

function gArrive(g){

  let pick=opts[0];
  if(g.state==='frightened'||(cfg.mode==='calm'&&(g.state==='chase')&&Math.random()<.22)){pick=opts[Math.floor(Math.random()*opts.length)];}
  else if(g.state==='eaten'){let best=1e9;for(const d of opts){const nx=g.tx+DIRS[d][0],ny=g.ty+DIRS[d][1];const v=L.distHouse[ny][nx];if(v>=0&&v<best){best=v;pick=d;}}}
  else{
    const [tx,ty]=gTarget(g);let best=1e9;
    for(const d of [0,2,1,3]){if(!opts.includes(d))continue;const nx=g.tx+DIRS[d][0],ny=g.ty+DIRS[d][1];const v=(nx-tx)**2+(ny-ty)**2;if(v<best){best=v;pick=d;}}
  }
  setDir(g,pick);g.moving=true;
}

function burst(x,y,col,n=10,sp=30){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=sp*(.4+Math.random());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-10,life:.5+Math.random()*.4,max:.9,col,s:Math.random()<.4?2:1});}}

/* =====================================================================
   7. UPDATE
   ===================================================================== */
const MODES=[['scatter',7],['chase',18],['scatter',6],['chase',22],['scatter',5],['chase',9999]];
function playUpdate(dt){
  L.clock+=dt;
  if(invuln>0)invuln-=dt;
  if(frightT>0){frightT-=dt;if(frightT<=0){ghosts.forEach(g=>{if(g.state==='frightened')g.state=mode;});chain=0;}}
  else{modeT-=dt;if(modeT<=0&&modeI<MODES.length-1){modeI++;mode=MODES[modeI][0];modeT=MODES[modeI][1];
    ghosts.forEach(g=>{if(g.state==='scatter'||g.state==='chase'){g.state=mode;reverse(g);}});}}
  // player
  const p=player;
  if(!p.moving&&p.want>=0&&canGo(p,p.want)){setDir(p,p.want);p.moving=true;p.t=0;}
  if(p.moving){advance(p,PSPEED*dt,pArrive);p.anim+=dt*10;}
  if(S!=='play')return;
  // pickups at nearest tile
  const n=nearest(p);
  if(L.gem[n.y]&&L.gem[n.y][n.x]){L.gem[n.y][n.x]=false;score+=10;SFX.gem();}
  for(const d of L.daggers){if(d.alive&&d.x===n.x&&d.y===n.y){d.alive=false;score+=50;SFX.dagger();frightT=cfg.mode==='calm'?9:7;chain=0;
    burst(d.x*TS+8,d.y*TS+8,'#ff6a6a',16,50);pop(d.x*TS+8,d.y*TS,'SCARE THEM!','#ffd0d0');
    ghosts.forEach(g=>{if(g.state==='scatter'||g.state==='chase'){g.state='frightened';reverse(g);}});}}
  for(const s of L.scrolls){if(s.alive&&s.x===n.x&&s.y===n.y){resolveScroll(s);return;}}
  // ghosts
  for(const g of ghosts){
    g.anim+=dt*6;
    if(g.state==='house'){g.timer-=dt;if(g.timer<=0){g.state='exit';g.moving=true;gArrive(g);}continue;}
    const sp=g.state==='frightened'?gSpeed()*.55:g.state==='eaten'?9:g.state==='exit'?gSpeed()*.8:gSpeed();
    if(!g.moving){gArrive(g);}
    advance(g,sp*dt,gArrive);
    // collision
    const a=posPx(p),b=posPx(g);
    if(Math.hypot(a.x-b.x,a.y-b.y)<9){
      if(g.state==='frightened'){g.state='eaten';chain++;const pts=100*Math.pow(2,chain);score+=pts;SFX.eat();burst(b.x+8,b.y+8,'#9fb0ff',14,50);pop(b.x+8,b.y,'+'+pts,'#bfc8ff');}
      else if((g.state==='scatter'||g.state==='chase'||g.state==='exit')&&invuln<=0){die();return;}
    }
  }
}
function die(){S='dying';dieT=1.1;candles--;SFX.hit();shake=6;burst(player.tx*TS+8,player.ty*TS+8,RED,18,60);}
function respawn(){setupPlayer();setupGhosts();mode='scatter';modeI=0;modeT=7;frightT=0;chain=0;invuln=2.2;S='play';}
function resolveScroll(s){
  const rm=plan[roomIdx];const wd=s.word;
  s.alive=false;
  if(s.correct){
    SFX.good();const bonus=500+candles*50;score+=bonus;burst(s.x*TS+8,s.y*TS+8,GOLD,30,70);pop(s.x*TS+8,s.y*TS,'+'+bonus,GOLD);
    say([{t:'SCROLL OF '+up(wd.w)+'!',s:wd.w+': '+wd.def},{t:'IN THE PLAY',s:wd.scene.replace('___',wd.w)}],()=>nextRoom());
  }else{
    SFX.wrong();candles--;stats[rm.word.w].wrong++;shake=4;burst(s.x*TS+8,s.y*TS+8,'#888',16,40);
    say([{t:'THAT SCROLL SAYS '+up(wd.w),s:'It means: '+wd.def}],()=>{if(candles<=0)gameOver();else S='play';});
  }
}
function nextRoom(){
  const next=roomIdx+1;
  trans={t:0,dir:1,cb:()=>{if(next>=plan.length){S='win';SFX.win();}else startRoom(next);}};
  S='transition';
}
function gameOver(){S='gameover';goSel=0;}

function update(dt){
  time+=dt;
  if(shake>0)shake=Math.max(0,shake-dt*14);
  parts=parts.filter(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=60*dt;return p.life>0;});
  pops=pops.filter(p=>{p.life-=dt;p.y-=14*dt;return p.life>0;});
  if(trans){trans.t+=dt/.35;if(trans.t>=1){const cb=trans.cb;if(trans.dir===1){trans={t:0,dir:-1};cb&&cb();}else{trans=null;}}}
  if(S==='intro')introT+=dt;
  else if(S==='play')playUpdate(dt);
  else if(S==='dying'){dieT-=dt;if(dieT<=0){if(candles<=0)gameOver();else respawn();}}
  else if(S==='falling'){fallT-=dt;if(fallT<=0){const p=player;p.tx=L.start.x;p.ty=L.start.y;p.t=0;p.dx=0;p.dy=0;p.moving=false;p.want=-1;invuln=1.2;S='play';}}
  else if(S==='dialog'&&dlg)dlg.t+=dt;
}

function press(d){
  ac();
  if(S==='play'||S==='falling'){
    const p=player;p.want=d;
    if(p.moving&&S==='play'&&DIRS[d][0]===-p.dx&&DIRS[d][1]===-p.dy&&(p.dx||p.dy))reverse(p);
    if(p.moving&&S==='play'&&d>=0&&(p.dx||p.dy)&&p.t===0&&canGo(p,d)){setDir(p,d);}
  }else if(S==='title'){
    if(d===0){menuSel=(menuSel+MENU.length-1)%MENU.length;SFX.select();}
    else if(d===1){menuSel=(menuSel+1)%MENU.length;SFX.select();}
    else if(menuSel>=4)activate();
  }else if(S==='gameover'){if(d<2){goSel=1-goSel;SFX.select();}}
  else if(S==='pause'){if(d<2){pauseSel=1-pauseSel;SFX.select();}}
}
function activate(){
  ac();
  if(S==='title'){
    if(menuSel<=2){SFX.start();newGame(menuSel);}
    else if(menuSel===3){S='how';SFX.select();}
    else if(menuSel===4){cfg.mode=cfg.mode==='calm'?'spooky':'calm';SFX.select();saveCfg();}
    else if(menuSel===5){setMusic(!musicOn);}
    else if(menuSel===6){sfxOn=!sfxOn;cfg.sfx=sfxOn;saveCfg();SFX.select();}
  }else if(S==='how'){S='title';SFX.select();}
  else if(S==='intro'){if(introT>.25){S='play';SFX.start();}}
  else if(S==='dialog'&&dlg){
    const pg=dlg.pages[dlg.i];
    if(dlg.t*45<pg.s.length){dlg.t=pg.s.length/45+.01;}
    else if(dlg.i<dlg.pages.length-1){dlg.i++;dlg.t=0;SFX.select();}
    else{const cb=dlg.cb;dlg=null;if(cb)cb();else S='play';}
  }
  else if(S==='gameover'){if(goSel===0){candles=maxCandles;startRoom(roomIdx);}else S='title';}
  else if(S==='pause'){if(pauseSel===0)S='play';else{S='title';}}
  else if(S==='win'){S='title';}
}
let prevS='play';
function togglePause(){
  if(S==='play'){S='pause';pauseSel=0;}
  else if(S==='pause')S='play';
  else if(S==='how')S='title';
}
const KEYS={ArrowUp:0,ArrowDown:1,ArrowLeft:2,ArrowRight:3,w:0,s:1,a:2,d:3,W:0,S:1,A:2,D:3};
addEventListener('keydown',e=>{
  if(e.key in KEYS){press(KEYS[e.key]);e.preventDefault();}
  else if(e.key===' '||e.key==='Enter'){activate();e.preventDefault();}
  else if(e.key==='p'||e.key==='P'||e.key==='Escape'){togglePause();e.preventDefault();}
  else if(e.key==='m'||e.key==='M'){setMusic(!musicOn);}
},{passive:false});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S==='play'){S='pause';pauseSel=0;}});

['touchend','pointerup','click','keydown'].forEach(ev=>addEventListener(ev,unlockAudio,true));
// pointer / touch on canvas
let swipe=null;
cv.addEventListener('pointerdown',e=>{
  cv.focus();ac();try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  swipe={x:e.clientX,y:e.clientY,done:false};
  if(S==='title'){
    for(let i=0;i<MENU.length;i++){const my=190+i*12;if(x>30&&x<274&&y>my-3&&y<my+10){menuSel=i;activate();return;}}
  }else if(S==='gameover'){for(let i=0;i<2;i++){const my=146+i*14;if(y>my-4&&y<my+11){goSel=i;activate();return;}}}
  else if(S==='pause'){for(let i=0;i<2;i++){const my=128+i*16;if(y>my-4&&y<my+12){pauseSel=i;activate();return;}}}
  else if(S!=='play'&&S!=='falling'&&S!=='dying')activate();
});
cv.addEventListener('pointermove',e=>{
  if(!swipe||swipe.done||S!=='play')return;
  const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))>18){swipe.done=true;press(Math.abs(dx)>Math.abs(dy)?(dx>0?3:2):(dy>0?1:0));swipe.x=e.clientX;swipe.y=e.clientY;swipe.done=false;}
});
addEventListener('pointerup',()=>{swipe=null;});

// on-screen pad
const pad=document.getElementById('pad');
document.querySelectorAll('#dpad button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();press(+b.dataset.d);}));
document.getElementById('bAct').addEventListener('pointerdown',e=>{e.preventDefault();activate();});
document.getElementById('bPause').addEventListener('pointerdown',e=>{e.preventDefault();togglePause();});
document.addEventListener('contextmenu',e=>{if(pad&&!pad.hidden)e.preventDefault();});

/* =====================================================================
   10. FIT TO SCREEN + MAIN LOOP
   ===================================================================== */
function fit(){
  const touch=matchMedia('(pointer:coarse)').matches||innerWidth<560;
  const land=touch&&innerWidth>innerHeight*1.15&&innerWidth>=700;
  pad.hidden=!touch;
  document.getElementById('app').classList.toggle('land',land);
  document.getElementById('hint').hidden=touch;
  const availW=Math.min(innerWidth-32-(land?360:0),1200);
  const availH=innerHeight-(land?44:touch?230:100);
  let s=Math.min(availW/W,availH/H);
  const dpr=window.devicePixelRatio||1;
  if(s>=2)s=Math.floor(s*dpr)/dpr;
  s=Math.max(s,.5);
  cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';
}
addEventListener('orientationchange',()=>setTimeout(fit,150));
addEventListener('resize',fit);fit();

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  try{update(dt);render();}catch(err){console.error(err);}
  requestAnimationFrame(frame);
}
function boot(){loadOverrides();requestAnimationFrame(t=>{last=t;frame(t);});}
if(document.fonts&&document.fonts.load){Promise.race([document.fonts.load('8px "Press Start 2P"'),new Promise(r=>setTimeout(r,1500))]).then(boot,boot);}else boot();

})();
</script>
